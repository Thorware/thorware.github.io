<!DOCTYPE html>
<html lang="en">
<head> <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum_scale=1.0, user_scalabe=no, viewport-fit=cover">
  <title>Thorware</title>
  <style> *{box-sizing:border-box; margin:0; padding:0;}
    html{width:100%;height:100%; margin:0; padding:0; overflow:hidden; background-color:#111111;}
    body{ background-color:#111111; margin:0; padding:0;
      display:flex; justify-content:center; align-items:center;
      position:absolute; top:0; left:0;
      overflow:hidden; user-select:none; cursor:pointer; overscroll-behavior:none; touch-action:none;
      -webkit-tap-highlight-color:transparent; }
    .field{ display:grid; background-color:black;
      width:var(--field-size); height:var(--field-size); aspect-ratio:1/1;
      grid-template-columns:repeat(5,1fr); grid-template-rows:repeat(5,1fr); margin:auto; }
    .player{background-color:red; width:100%; height:100%; grid-row:3; grid-column:3; position:relative; container-type:inline-size;}
    .arrow{position:absolute; display:none; background-color:#dddddd; width:16cqw;height:40cqw;}
    .player.help .arrow{display:block;}
    .arrow.left{top:50%; left:4cqw; transform:translateY(-50%); clip-path: polygon(0% 50%,100% 0%,100% 100%);}
    .arrow.right{top:50%; right:4cqw; transform:translateY(-50%); clip-path: polygon(0% 0%,100% 50%,0% 100%);}
  </style>
</head>
<body>
  <div class="field"><div id="guy" class="player">
    <div class="arrow left"></div><div class="arrow right"></div>
  </div></div>
  <script> cap=(x,c)=>Math.min(x,c); base=(x,c)=>Math.max(x,c); clamp=(x,a,b)=>Math.min(Math.max(x,a),b);
    col=parseInt(getComputedStyle(guy).gridColumnStart)-1; help=false;
    document.body.addEventListener('pointerdown', (e)=>{ if(!e.isPrimary || e.button > 0) return;
      e.preventDefault(); clickGuy=guy.contains(e.target); clickGuy?help=!help:help=false;
      guy.classList.toggle('help',help); if(clickGuy) return;
      box=guy.getBoundingClientRect(); centerX=box.left+box.width/2;
      col=clamp(col+(e.clientX<centerX?-1:1),0,4); guy.style.gridColumn=col+1; });
    
    document.addEventListener('touchstart',function(event){if(event.touches.length>1) event.preventDefault();},{passive:false});
    lastTouchEnd=0;
    document.addEventListener('touchend',function(event){ now=(new Date()).getTime();
      if(now-lastTouchEnd<=300){event.preventDefault();} lastTouchEnd=now; },false);
    document.addEventListener('touchmove',(e)=>{e.preventDefault();},{passive:false});
    function resize(){ window.scrollTo(0,0); vv=window.visualViewport;
      width=vv?vv.width:document.documentElement.clientWidth; height=vv?vv.height:document.documentElement.clientHeight;
      document.body.style.width=`${width}px`; document.body.style.height=`${height}px`;
      size=Math.min(width,height); document.documentElement.style.setProperty('--field-size', `${size}px`); }
    window.addEventListener('resize',resize); if(window.visualViewport){
      window.visualViewport.addEventListener('resize', resize);
      window.visualViewport.addEventListener('scroll', resize); }
    window.addEventListener('orientationchange',()=>{ resize();
      [100,250,400,600].forEach(delay=>{setTimeout(resize,delay);}); });
    resize();
  </script>
</body>
</html>
