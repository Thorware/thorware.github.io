  <title>Red Square</title>
  <style> *{box-sizing:border-box; margin:0; padding:0; -webkit-user-drag:none;-webkit-touch-callout:none;}
    :root{--guyColor:red;--c0Color:yellow;--c1Color:#1F26EB;--c2Color:#C50000;}
    html{width:100%;height:100%; overflow:hidden; background-color:#111;}
    body{ background-color:#202020; display:flex;justify-content:center;align-items:center; position:absolute;

      grid-template-columns:repeat(var(--gridDim),1fr); grid-template-rows:repeat(var(--gridDim),1fr); margin:auto;
      container-type:inline-size; }
    #guyAura{width:100%;height:100%; position:relative; container-type:inline-size; grid-area:auto;}
    .arrow{ display:none; position:absolute; background-color:#ddd; width:40cqw;height:12cqw; top:50%;left:50%;
      clip-path:polygon(50% 0%,0 100%, 100% 100%);
      transform:translate(-50%,-50%) rotate(var(--r)) translateY(-100cqw); }
    .arrow.up{--r:0deg;} .arrow.right{--r:90deg;} .arrow.down{--r:180deg;} .arrow.left{--r:270deg;}
    #guyAura.help .arrow{display:block;}

    .tile{ width:100%;height:100%; position:relative; container-type:inline-size;
      background-color:var(--tileColor); outline:1px solid var(--tileColor); outline-offset:-0.5px }
    .wall{--tileColor:#444;}

      background:linear-gradient(var(--coinColor),var(--coinColor)) center / 100% 100% no-repeat;
      mask:linear-gradient(black 0 0) content-box, linear-gradient(black 0 0);

    .plate.full{ background-image:linear-gradient(var(--coinColor),var(--coinColor));

      top:0%;left:30%;transform:translateX(-50%); }

      bottom:-1px;left:70%;transform:translateX(-50%); }
    .water{ background-color:color-mix(in srgb,var(--c1Color),black 25%); width:80%;height:80%;
      clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%); z-index:8; }
    .dirt{--tileColor:#422E20;}
    .light{width:92%;height:92%; border-radius:50%;background-color:var(--c0Color);}
    .light.got{background-color:color-mix(in srgb,var(--c0Color),black 75%);}
    .spot{ width:98%;height:98%; border-radius:50%; z-index:1;
      background-color:transparent; border:calc(6cqw/var(--gridDim)) solid var(--c0Color); }
    .button{ width:40%;height:40%; border-radius:50%;
      background-color:var(--c2Color);opacity:calc(100%*(1 - .8*var(--buttonT))); }

    .caseRing{ width:98%;height:98%; border-radius:50%; border:calc(6cqw/var(--gridDim)) solid var(--c2Color); 
      opacity:calc((10% + 90%*var(--buttonT))*clamp(0,var(--buttonT)*1000,1)); box-sizing:border-box; grid-area:1/1; }
    .caseCoin{ background-color:var(--coinColor); width:35%;height:35%; opacity:clamp(0,var(--buttonT)*1000,1);
        grid-area:1/1; }
    .end{ width:100%;height:100%; display:flex; align-items:center; justify-content:center; text-align:center;
      font-size:3.8cqw; color:white; box-sizing:border-box; z-index:99;
      min-width:0;min-height:0; overflow-wrap:anywhere; overflow:hidden; white-space:pre-line;
      font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace; }
  </style>

<body>
  <template id="guyMold"><div id="guyAura">
    <div id="guy"><div id="hands">
      <div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div>
    </div></div>
    <div class="arrow left"></div><div class="arrow right"></div>
    <div class="arrow up"></div><div class="arrow down"></div>
  </div></template>
  <div id="land"></div>
  <script> const {min,max,abs,sign}=Math; function clamp(x,lo,hi){return min(max(x,lo),hi);}
    function startInputTimers(das,arr){prevTime=performance.now(),isDAS=true;
      function tick(time){ if(isDAS){ if(time-prevTime>=das)isDAS=false,prevTime=time,input.stepFn();
          }else{dTime=time-prevTime; if(dTime>=arr)input.stepFn(),prevTime=time-(dTime%arr);}
        if(input.loop!=null)input.loop=requestAnimationFrame(tick); } input.loop=requestAnimationFrame(tick); }
    function beginInput(stepFn,das,arr){input.stepFn=stepFn; startInputTimers(das,arr); stepFn();}
    function stopInput(){ const i=input; cancelAnimationFrame(i.loop),i.loop=null;
      i.type=null,i.key=null,i.dirX=0,i.dirY=0,i.targX=0,i.targY=0,i.pointerId=null; }
    function hitchInput(){if(input.type!='p')return; cancelAnimationFrame(input.loop),startInputTimers(250,130);}
    function kbStep(){tryMove(input.dirX,input.dirY);}
    function pStep(){ box=guy.getBoundingClientRect(); s=box.width; h=s/2; cx=box.left+h;cy=box.top+h;
      vx=input.targX-cx;vy=input.targY-cy; ax=abs(vx); ay=abs(vy); dx=vx<0?-1:1;dy=vy<0?-1:1;
      if(ax<=h&&ay<=h)return; card=ax<=h||ay<=h; vert=ay>ax;
      if(vert){if(!tryMove(0,dy)&&!card) tryMove(dx,0);} else if(!tryMove(dx,0)&&!card) tryMove(0,dy); }

    function checkGate(o){if(slotsUsed<4)return false; for(i=0;i<4;++i)if(slots[i]!=o.st)return false;return true;}
    function blocked(x,y){return obj.some(o=>o.x==x&&o.y==y&&(o.t=='w'&&!noclip||o.t=='g'&&!checkGate(o)));}
    function tryMove(dx,dy){if(blocked(myX+dx,myY+dy))return false; move(dx,dy); return true;}
    function removeObj(o){o.el.remove(),o.el=null,obj.splice(obj.indexOf(o),1);}
    function setGot(){got.push({r:room,x,y});}  function setGot(st){got.push({r:room,x,y,st});}
    function getGotIdx(){return got.findIndex(g=>g.r==room&& g.x==x&& g.y==y);}
    function isGot(){return -1!=getGotIdx();}
    function clearGot(){got.splice(getGotIdx(),1);}  function getGot(){return got[getGotIdx()];}
    
    function move(dx,dy){ if(water){ if(onDirt){ --water,h=waterHistory[water],h.x=h.y=-1,st=onDirt.st
          ,makeFlavor('c','coin',myX,myY,onDirt.st).got=true,removeObj(onDirt),onDirt=null,x=myX,y=myY,setGot(st); }
        else{for(i=water-1;i>0;--i)waterHistory[i]=waterHistory[i-1]; waterHistory[0]={x:myX,y:myY};} dWater(); }
      if(help)help=false,outgrowHelp=true,dHelp(); myX+=dx,myY+=dy,dGuyPos(); edge=false;
      if(myX<0||dx&&myX==0)edge=true,--room; else if(myY<0||dy&&myY==0)edge=true,room-=roomSpan;
      else if(myX>end||dx&&myX==end)edge=true,++room; else if(myY>end||dy&&myY==end)edge=true,room+=roomSpan;
      else if(gridDim>19&&dx){if(dx<0&&myX<4)edge=true,--room;else if(dx>0&&myX>end-4)edge=true,++room;}
      if(edge)newRoom(dx,dy),outgrowHelp=true; x=myX,y=myY; function takeCoin(st){slots[slotsUsed++]=st,dHands();}
      buttonFresh=false; for(o of obj){ t=o.t; if(t=='w')continue; if(x!=o.x||y!=o.y)continue;
        if(t=='c'){ if(slotsUsed==4)continue; takeCoin(o.st); if(o.got)clearGot(); removeObj(o);
          if(!o.light)setGot();else{ o.light.el.classList.toggle('got',true),removeObj(o.light.spot)
            ,g=got[got.findIndex(g=>g.r==room&&g.x==o.light.x&&g.y==o.light.y)],g.dx=null,g.dy=null,g.dist=null; }}
        else if(t=='g'){ removeObj(o),slotsUsed=0,slots=[-1,-1,-1,-1],dHands(),setGot();
          if(o.cp)localStorage.setItem('checkpoint',o.cp),got=[],loadCheckpoint(o.cp); }
        else if(t=='p'){ if(o.got){if(slotsUsed==4)continue; takeCoin(o.st),clearGot();}
          else{ if(slotsUsed==0)continue; idx=slots.lastIndexOf(o.st); if(idx==-1)continue;
            for(i=idx;i<slotsUsed;++i)slots[i]=i==3?-1:slots[i+1];--slotsUsed,dHands(),setGot(); }
          o.got=!o.got, o.el.classList.toggle('full',o.got); }
        else if(t=='o'){ if(o.got){if(slotsUsed==4)continue; takeCoin(o.st),clearGot();}
          else{ if(slotsUsed==0)continue; o.st=slots[--slotsUsed],slots[slotsUsed]=-1,dHands(),setGot(o.st)
            ,o.el.style='--coinColor:'+subtypeColors[o.st],o.el.style.gridColumn=x+1,o.el.style.gridRow=y+1; }
          o.got=!o.got, o.el.classList.toggle('full',o.got); }
        else if(t=='j'){
          if(slotsUsed==4){if(slots.some(me=>me!=o.st1))continue;slotsUsed=1,slots=[o.st2,-1,-1,-1],dHands();}
          else if(slotsUsed==1){if(slots[0]!=o.st2)continue;slotsUsed=4,slots=[o.st1,o.st1,o.st1,o.st1],dHands();} }
        else if(t=='~'){water=0;for(i=0;i<slotsUsed;++i)if(slots[i]==1)++water;}
        else if(t=='b'){if(water>0)onDirt=o;}
        else if(t=='@'){ if(roomClear[room])break; gi=getGotIdx(); if(gi!=-1&&got[gi].dx==null)break;
          light=0;for(i=0;i<slotsUsed;++i)if(slots[i]==0)++light; sp=o.spot;
          s=sp.el.style;sx=clamp(x+dx*light,0,end),sy=clamp(y+dy*light,0,end); s.gridColumn=1+sx,s.gridRow=1+sy;
          if(o.coin)removeObj(o.coin),o.coin=null;
          if(sx==o.tx&&sy==o.ty)o.coin=makeFlavor('c','coin',sx,sy,o.st),o.coin.light=o;
          if(gi==-1){if(light>0)got.push({r:room,x,y,dx,dy,dist:light});}else{
            if(light==0)got.splice(gi,1);else g=got[gi],g.dx=dx,g.dy=dy,g.dist=light; }}
        else if(t=='.'){ b=0;for(i=0;i<slotsUsed;++i)if(slots[i]==2)++b; buttonFresh=b>0;
          buttonMax=5*b,buttonLeft=buttonMax;if(buttonMax==0)buttonMax=1;dButton(); }
        else if(t==','){if(slotsUsed==4||buttonLeft==0)continue; takeCoin(o.st),setGot(),removeObj(o);} }
        if(buttonLeft>0&&!buttonFresh)--buttonLeft,dButton(); }

    function dGridDim(){document.documentElement.style.setProperty('--gridDim',gridDim);}
    function dGuyPos(){s=guyAura.style,s.gridColumn=myX+1,s.gridRow=myY+1;}
    function dHelp(){guyAura.classList.toggle('help',help);}
    function dHands(){ if(water){ cnt=0;for(i=0;i<slotsUsed;++i)if(slots[i]==1)++cnt;
        if(water>cnt){for(i=cnt;i<water;++i)h=waterHistory[i],h.x=h.y=-1; water=cnt,dWater();} }
      if(buttonLeft){cnt=0;for(i=0;i<slotsUsed;++i)if(slots[i]==2)++cnt; if(cnt==0)buttonLeft=0,dButton();}
      c=document.querySelectorAll('#hands .slot');
      for(i=0;i<4;++i){ c[i].classList.toggle('on',i<slotsUsed);
        if(i<slotsUsed)c[i].style='--coinColor:'+subtypeColors[slots[i]]; }}
    function dWater(){ for(i=0;i<4;++i){ s=waterEl[i].style;h=waterHistory[i];
        if(water>i)s.gridColumn=h.x+1,s.gridRow=h.y+1;else s.gridColumn=s.gridRow=-1; }}
    function dButton(){document.documentElement.style.setProperty('--buttonT',buttonLeft/buttonMax);}

    function makeEl(cName){let el=document.createElement('div');el.className=cName;return el;}
    function makeWalls(c,gap){ end=gridDim-1,mid=end/2,x=0,y=0,dx=0,dy=0;
      if(c=='T')dx=1; else if(c=='L')dy=1; else if(c=='B')y=end,dx=1; else if(c=='R')x=end,dy=1;
      for(i=0;i<=end;++i,x+=dx,y+=dy)if(abs(mid-i)>=gap)makeBasic('w','tile wall',x,y); }
    function makeGuy(){ for(i=0;i<4;++i)waterEl[i]=makeEl('water'),s=waterEl[i].style,s.gridColumn=s.gridRow=-1
      ,land.appendChild(waterEl[i]); land.appendChild(guyMold.content.cloneNode(true)); dGuyPos();dHands(); }
    function makePart(name,dad,st){n=makeEl(name),n.style='--coinColor:'+subtypeColors[st],dad.appendChild(n);}
    function makeJoiner(x,y){ n=makeBasic('j','station',x,y),n.st1=st1,n.st2=st2;
      el=n.el.appendChild(makeEl('joiner')),makePart('joinerBand',el,st1),makePart('joinerSingle',el,st2); }
    function makeBasic(t,cName,x,y){ el=makeEl(cName);
      el.style.gridColumn=x+1,el.style.gridRow=y+1,land.appendChild(el); return obj[obj.push({t,x,y,el})-1]; }
    function makeFlavor(t,cName,x,y,st){ el=makeEl(cName); el.style='--coinColor:'+subtypeColors[st];
      el.style.gridColumn=x+1,el.style.gridRow=y+1,land.appendChild(el); return obj[obj.push({t,st,x,y,el})-1];
    } subtypeColors=['yellow','#1F26EB','#C50000'];
    function newRoom(dx=0,dy=0){ for(i=0;i<4;++i)waterHistory[i].x=waterHistory[i].y=-1;
      hitchInput(),obj=[],land.replaceChildren(),room=clamp(room,0,roomCodes.length-1)
      ,s=roomCodes[room],newDim=+s.slice(0,2),end=newDim-1,mid=end/2,loadIn=(dx==0&&dy==0);if(loadIn)myY=myX=mid;else{
        om=(gridDim-1)/2,ox=myX,oy=myY; if(dx!=0){ offY=myY-om,myY=clamp(mid+offY,0,end),myX=dx>0?0:end;
          if(newDim<gridDim&& 0<oy&&oy<gridDim-1&& (myY==0||myY==end))myY-=sign(offY); }
        else{ offX=myX-om,myX=clamp(mid+offX,0,end),myY=dy>0?0:end;
          if(newDim<gridDim&& 0<ox&&ox<gridDim-1&& (myX==0||myX==end))myX-=sign(offX); }}
      gridDim=newDim,dGridDim(); s=s.slice(2); x=y=0; autoW=false; cleared=roomClear[room];
      wallsDone=false;for(pos=0;pos<s.length;++pos){ c=s[pos]; switch(c){ case'T':case'B':case'L':case'R':
          gap=0,n=s[pos+1];if('0'<=n&&n<='9')gap=+s[++pos];makeWalls(c,gap);break;default:wallsDone=true; }
        if(wallsDone)break; }
      for(let i=pos;i<s.length;++i){ c=s[i]; dx=0,dy=0,m=0; switch(c){
          case'1':x=y=0;break; case'2':x=mid,y=0;break; case'3':x=end,y=0;break;
          case'4':x=0,y=mid;break; case'5':x=y=mid;break; case'6':x=end,y=mid;break;
          case'7':x=0,y=end;break; case'8':x=mid,y=end;break; case'9':x=y=end;break;
          case'u':dy=-1;break; case'd':dy=1;break; case'l':dx=-1;break; case'r':dx=1;break;
          case'U':dy=-1,m=1;break; case'D':dy=1,m=1;break; case'L':dx=-1,m=1;break; case'R':dx=1,m=1;break;
          case'W':autoW=!autoW;if(!autoW)break; case'w':makeBasic('w','tile wall',x,y);break;
          case'c':st=+s[++i];if(cleared||isGot())break;makeFlavor(c,'coin',x,y,st);break;
          case'g':++i;cp=null;if(s[i]=="'")++i,z=s.indexOf("'",i),cp=s.slice(i,z),i=z+1;st=+s[i];
            if(cp&&loadIn&&!dev)myX=x,myY=y;if(cleared||isGot())break;makeFlavor(c,'gate',x,y,st).cp=cp;break;
          case'p':st=+s[++i];n=makeFlavor(c,'plate',x,y,st);n.got=isGot();n.el.classList.toggle('full',n.got);break;
          case'o':gotIdx=getGotIdx(); if(gotIdx==-1)makeBasic(c,'plate omni',x,y);
            else makeFlavor(c,'plate omni full',x,y,got[gotIdx].st).got=true; break;
          case'j':st1=+s[++i],st2=+s[++i];makeJoiner(x,y);break;
          case'~':makeBasic('~','water',x,y);break;
          case'b':st=+s[++i];if(cleared)break;gotIdx=getGotIdx();
            if(gotIdx==-1){makeBasic('b','tile dirt',x,y).st=st;break;}
            if(got[gotIdx].st!=null)makeFlavor('c','coin',x,y,st).got=true;break;
          case'@':o=makeBasic('@','light',x,y);o.st=+s[++i];d=s[++i]; tdx=d=='l'?-1:d=='r'?1:0;
            tdy=d=='u'?-1:d=='d'?1:0; toss=+s[++i],o.tx=x+tdx*toss,o.ty=y+tdy*toss,gotIdx=getGotIdx();
            if(cleared||gotIdx!=-1&&got[gotIdx].dx==null){o.el.classList.toggle('got',true);break;}
            sx=x,sy=y;if(gotIdx!=-1){g=got[gotIdx];sx=clamp(sx+g.dx*g.dist,0,end),sy=clamp(sy+g.dy*g.dist,0,end);}
            o.spot=sp=makeBasic('','spot',sx,sy);
            if(sx==o.tx&&sy==o.ty)o.coin=makeFlavor('c','coin',sx,sy,o.st),o.coin.light=o;break;
          case'.':o=makeBasic('.','button',x,y);break;
          case',':st=+s[++i];if(cleared||isGot())break;o=makeBasic(',','case',x,y),o.st=st;
            makePart('caseCoin',o.el,st);o.el.appendChild(makeEl('caseRing'));break;
          case'Z':makeBasic('Z','end',x,y).el.textContent='This game is in active development.\nMore to come...';
            break; }
        if(dx||dy){ rpt=1; if(m){rpt=+s[++i]; if(rpt==1)rpt=10+ +s[++i];}
          for(j=0;j<rpt;++j){x+=dx,y+=dy;if(autoW)makeBasic('w','tile wall',x,y);} }}
      makeGuy(); }
    function roomID(yxPos){return roomSpan*(yxPos[0]-1)+(yxPos[1]-1);}
    function clearRoom(y,x){roomClear[roomID([y,x])]=true;}
    function clearRooms(y1,x1,y2,x2){for(y=y1;y<=y2;++y)for(x=x1;x<=x2;++x)clearRoom(y,x);}
    function setRoom(y,x){room=roomID([y,x]);}
    function initRooms(){ dr=roomID(devR); dev=dr>0; room=(dev?dr:roomID(startRoom));
      roomClear=Array.from({length:roomCodes.length},()=>false);
      cp=localStorage.getItem('checkpoint'); if(cp&&!dev)loadCheckpoint(cp),outgrowHelp=true; newRoom(); }
    function restart(){ localStorage.removeItem('checkpoint'); got=[]; slotsUsed=0; slots=[-1,-1,-1,-1];
      help=false;outgrowHelp=false; initRooms(); }
    function warp(){restart(),cp='field',localStorage.setItem('checkpoint',cp),loadCheckpoint(cp),newRoom();}
    function loadCheckpoint(cp){ if(!checkpoints.includes(cp))return;
      clearRooms(17,1,19,3);if(cp=='intro_jailcell'){setRoom(17,3);return;}
      clearRooms(16,1,16,3);if(cp=='intro_maze'){setRoom(16,3);return;}
      clearRooms(14,1,15,3);if(cp=='intro_overfill'){setRoom(14,1);return;}
      clearRooms(11,1,13,3);clearRoom(10,2);if(cp=='intro_blue'){setRoom(10,2);return;}
      clearRooms(8,1,10,1);clearRoom(9,2);if(cp=='intro_omni'){setRoom(8,1);return;}
      clearRoom(8,2);if(cp=='intro_traffic'){setRoom(8,2);return;}
      clearRooms(8,3,10,3);if(cp=='intro_joiner'){setRoom(8,3);return;}
      clearRooms(7,1,7,3);if(cp=='intro_joinMix'){setRoom(7,2);return;}
      clearRooms(6,1,6,2);if(cp=='intro_splitter'){setRoom(6,2);return;}
      clearRoom(5,2);if(cp=='intro_joinSplit'){setRoom(5,2);return;}
      clearRooms(4,1,5,1);clearRoom(4,2);if(cp=='intro_splitOne'){setRoom(4,2);return;}
      clearRooms(4,3,6,3);if(cp=='intro_mine'){setRoom(4,3);return;}
      clearRooms(1,1,3,8);clearRooms(4,4,5,8);if(cp=='field'){setRoom(5,8);return;}
      clearRooms(6,4,6,8);clearRoom(7,4);if(cp=='water_intro'){setRoom(6,7);return;}
      clearRooms(7,5,7,8);clearRoom(8,6);if(cp=='water_farm'){setRoom(7,8);return;}
      clearRooms(8,7,9,8);clearRoom(9,6);clearRoom(10,7);if(cp=='light_intro'){setRoom(9,8);return;}
      clearRooms(11,6,11,8);clearRoom(10,8);if(cp=='light_remove'){setRoom(11,6);return;}
