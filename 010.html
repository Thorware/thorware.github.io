    , viewport-fit=cover">
  <title>Thorware</title>
  <style> *{box-sizing:border-box; margin:0; padding:0; -webkit-user-drag:none;-webkit-touch-callout:none;}
    :root{--guyColor:red;--coinColor:yellow;}
    html{width:100%;height:100%; overflow:hidden; background-color:#111;}
    body{ background-color:#202020; display:flex;justify-content:center;align-items:center; position:absolute;
      top:0; left:0; overflow:hidden; user-select:none; cursor:pointer; overscroll-behavior:none; touch-action:none;
      -webkit-tap-highlight-color:transparent; -webkit-user-select:none; }
    #land{ display:grid; background-color:black; overflow:hidden;
      width:var(--bounds);height:var(--bounds); aspect-ratio:1/1; place-items:center;
      grid-template-columns:repeat(var(--gridDim),1fr); grid-template-rows:repeat(var(--gridDim),1fr); margin:auto;
      container-type:inline-size; }
    #guyAura{width:100%;height:100%; position:relative; container-type:inline-size; grid-area:auto;}
    .arrow{ display:none; position:absolute; background-color:#ddd; width:40cqw;height:12cqw; top:50%;left:50%;
      clip-path:polygon(50% 0%,0 100%, 100% 100%);
      transform:translate(-50%,-50%) rotate(var(--r)) translateY(-100cqw); }
    .arrow.up{--r:0deg;} .arrow.right{--r:90deg;} .arrow.down{--r:180deg;} .arrow.left{--r:270deg;}
    #guyAura.help .arrow{display:block;}
    #guy{ background-color:var(--guyColor); width:100%;height:100%; position:relative; container-type:inline-size;
      clip-path:inset(0 0 0 0); z-index:9; }
    #hands{ position:absolute; bottom:-1px;top:0; left:50%; transform:translateX(-50%); width:25%;
      display:flex;flex-direction:column-reverse; }
    .slot{background:var(--coinColor); flex:1; visibility:hidden;} .slot.on{visibility:visible;}
    .tile{ width:100%;height:100%; position:relative; container-type:inline-size;
      background-color:var(--tileColor); outline:1px solid var(--tileColor); outline-offset:-0.5px }
    .wall{--tileColor:#444;}
    .coin{background-color:var(--coinColor); width:35%;height:35%;}
    .gate{ width:85%;height:85%;
      background:linear-gradient(var(--coinColor),var(--coinColor)) center / 100% 100% no-repeat;
      mask:linear-gradient(black 0 0) content-box, linear-gradient(black 0 0);
      mask-composite:exclude; padding:10%; box-sizing:border-box; }
    .plate{background-color:color-mix(in srgb,var(--coinColor),black 50%); width:90%;height:90%;}
    .plate.full{ background-image:linear-gradient(var(--coinColor),var(--coinColor));
      background-size:38% 38%; background-position:center; background-repeat: no-repeat; }
    .plate.omni{background-color:#bbb;}
    .TL{top:0;left:0;} .TR{top:0;right:0;} .BL{bottom:0;left:0;} .BR{bottom:0;right:0;}
    .joiner{position:relative; background-color:black; width:70%;height:70%; overflow:hidden;}
    .joinerEl{position:absolute; width:35%;height:35%; background-color:var(--coinColor);}
    .joinerEl.MID{ top:50%;left:50%;transform:translate(-50%,-50%);z-index:2; width:80%;height:80%; 
      background-color:var(--coinColor); }
    .splitter{position:relative; background-color:black; width:70%;height:70%; overflow:hidden;}
    .splitterEl{position:absolute; width:35%;height:35%; background-color:var(--coinColor); z-index:2;}
    .splitterEl.MID{top:50%;left:50%;transform:translate(-50%,-50%);z-index:1; width:80%;height:80%;}
    .end{ width:100%;height:100%; display:flex; align-items:center; justify-content:center; text-align:center;
      font-size:3.8cqw; color:white; box-sizing:border-box; z-index:99;
      min-width:0;min-height:0; overflow-wrap:anywhere; overflow:hidden; white-space:pre-line;
      font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace; }
  </style>
</head>

  <template id="guyMold"><div id="guyAura">
    <div id="guy"><div id="hands">
      <div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div>
    </div></div>
    <div class="arrow left"></div><div class="arrow right"></div>
    <div class="arrow up"></div><div class="arrow down"></div>
  </div></template>

  <script> const {min,max,abs}=Math; function clamp(x,lo,hi){return min(max(x,lo),hi);}
    function startInputTimers(das,arr)
      {input.delay=setTimeout(()=>{input.repeat=setInterval(input.stepFn,arr);input.stepFn();},das);}
    function beginInput(stepFn,das,arr){input.stepFn=stepFn; startInputTimers(das,arr); stepFn();}
    function stopInput(){ const i=input; clearTimeout(i.delay);clearInterval(i.repeat); i.delay=null;i.repeat=null;
      i.type=null; i.key=null; i.dirX=0;i.dirY=0; i.targX=0;i.targY=0; i.pointerId=null; }
    function hitchInput(){ if(input.type!='p')return;
      clearTimeout(input.delay);clearInterval(input.repeat); startInputTimers(200,130); }
    function kbStep(){tryMove(input.dirX,input.dirY);}
    function pStep(){ box=guy.getBoundingClientRect(); s=box.width; h=s/2; cx=box.left+h;cy=box.top+h;
      vx=input.targX-cx;vy=input.targY-cy; ax=abs(vx); ay=abs(vy); dx=vx<0?-1:1;dy=vy<0?-1:1;
      if(ax<=h&&ay<=h)return; card=ax<=h||ay<=h; vert=ay>ax;
      if(vert){if(!tryMove(0,dy)&&!card) tryMove(dx,0);} else if(!tryMove(dx,0)&&!card) tryMove(0,dy); }

    function checkGate(o){if(slotsUsed<4)return false; for(i=0;i<4;++i)if(slots[i]!=o.st)return false;return true;}
    function blocked(x,y){return obj.some(o=>o.x==x&&o.y==y&&(o.t=='w'&&!noclip||o.t=='g'&&!checkGate(o)));}
    function tryMove(dx,dy){if(blocked(myX+dx,myY+dy))return false; move(dx,dy); return true;}
    function removeObj(o){o.el.remove(),o.el=null,obj.splice(obj.indexOf(o),1);}
    function setGot(){got.push({r:room,x,y});} function setGot(st){got.push({r:room,x,y,st});}
    function clearGot(){got.splice(got.findIndex(g=>g.r==room&& g.x==x&& g.y==y),1);}
    function takeCoin(st){slots[slotsUsed++]=st,dHands();}
    function move(dx,dy){ if(help)help=false,outgrowHelp=true,dHelp(); myX+=dx,myY+=dy,dGuyPos(); edge=false;
      if(myX<0||dx&&myX==0)edge=true,--room; else if(myY<0||dy&&myY==0)edge=true,room-=roomSpan;
      else if(myX>end||dx&&myX==end)edge=true,++room; else if(myY>end||dy&&myY==end)edge=true,room+=roomSpan;
      if(edge)newRoom(dx,dy),outgrowHelp=true; x=myX,y=myY;
      for(o of obj){ t=o.t; if(t=='w')continue; if(x!=o.x||y!=o.y)continue;
        if(t=='c'){if(slotsUsed==4)continue; takeCoin(o.st),removeObj(o),setGot();}
        else if(t=='g'){removeObj(o),slotsUsed=0,slots=[-1,-1,-1,-1],dHands(),setGot();}
        else if(t=='p'){
          if(o.got){if(slotsUsed==4)continue; takeCoin(o.st),clearGot();}
          else{ if(slotsUsed==0)continue; idx=slots.lastIndexOf(o.st); if(idx==-1)continue;
            for(i=idx;i<slotsUsed;++i)slots[i]=i==3?-1:slots[i+1];--slotsUsed,dHands(),setGot(); }
          o.got=!o.got, o.el.classList.toggle('full',o.got); }
        else if(t=='o'){
          if(o.got){if(slotsUsed==4)continue; takeCoin(o.st),clearGot();}
          else{ if(slotsUsed==0)continue; o.st=slots[--slotsUsed],slots[slotsUsed]=-1,dHands(),setGot(o.st)
            ,o.el.style='--coinColor:'+subtypeColors[o.st],o.el.style.gridColumn=x+1,o.el.style.gridRow=y+1; }
          o.got=!o.got, o.el.classList.toggle('full',o.got); }
        else if(t=='j'){ if(slotsUsed<4)continue;if(slots.some(me=>me!=o.st1))continue;
          slotsUsed=1,slots=[o.st2,-1,-1,-1],dHands(); }
        else if(t=='s'){ if(slotsUsed!=1)continue;if(slots[0]!=o.st1)continue;
          slotsUsed=4,slots=[o.st2,o.st2,o.st2,o.st2],dHands(); }}}

    function dGridDim(){document.documentElement.style.setProperty('--gridDim',gridDim);}
    function dGuyPos(){guyAura.style.gridColumn=myX+1;guyAura.style.gridRow=myY+1;}
    function dHelp(){guyAura.classList.toggle('help',help);}
    function dHands(){ c=document.querySelectorAll('#hands .slot');
      for(i=0;i<4;++i){ c[i].classList.toggle('on',i<slotsUsed);
        if(i<slotsUsed)c[i].style='--coinColor:'+subtypeColors[slots[i]]; }}

    function makeEl(cName){let el=document.createElement('div');el.className=cName;return el;}
    function makeWalls(c,gap){ end=gridDim-1,mid=end/2,x=0,y=0,dx=0,dy=0;
      if(c=='T')dx=1; else if(c=='F')dy=1; else if(c=='B')y=end,dx=1; else if(c=='G')x=end,dy=1;
      for(i=0;i<=end;++i,x+=dx,y+=dy)if(abs(mid-i)>=gap)makeBasic('w','tile wall',x,y); }
    function makeGuy(){land.appendChild(guyMold.content.cloneNode(true)); dGuyPos();dHands();}
    function makePart(name,dad,st){n=makeEl(name),n.style='--coinColor:'+subtypeColors[st],dad.appendChild(n);}
    function makeJoiner(x,y){ n=makeBasic('j','joiner',x,y);n.st1=st1,n.st2=st2;el=n.el;
      makePart('joinerEl TL',el,st1),makePart('joinerEl TR',el,st1),makePart('joinerEl BL',el,st1)
      ,makePart('joinerEl BR',el,st1),makePart('joinerEl MID',el,st2); }
    function makeSplitter(x,y){ n=makeBasic('s','splitter',x,y);n.st1=st1,n.st2=st2;el=n.el;
      makePart('splitterEl TL',el,st2),makePart('splitterEl TR',el,st2),makePart('splitterEl BL',el,st2)
      ,makePart('splitterEl BR',el,st2),makePart('splitterEl MID',el,st1); }
    function makeBasic(t,cName,x,y){ el=makeEl(cName);
      el.style.gridColumn=x+1,el.style.gridRow=y+1,land.appendChild(el); return obj[obj.push({t,x,y,el})-1]; }
    function makeFlavor(t,cName,x,y,st){ el=makeEl(cName); el.style='--coinColor:'+subtypeColors[st];
      el.style.gridColumn=x+1,el.style.gridRow=y+1,land.appendChild(el); return obj[obj.push({t,st,x,y,el})-1];
    } subtypeColors=['yellow','blue'];
    function isGot(){return-1!=got.findIndex(g=>g.r==room&&g.x==x&&g.y==y);}
    function newRoom(dx=0,dy=0){ hitchInput(),obj=[],land.replaceChildren(),room=clamp(room,0,roomCodes.length-1)
      ,s=roomCodes[room],newDim=+s.slice(0,2),end=newDim-1,mid=end/2; if(dx==0&&dy==0)myY=myX=mid;else{
        om=(gridDim-1)/2; if(dx!=0)offY=myY-om,myY=clamp(mid+offY,0,end),myX=dx>0?0:end;
        else offX=myX-om,myX=clamp(mid+offX,0,end),myY=dy>0?0:end; }
      gridDim=newDim,dGridDim(); s=s.slice(2); x=y=0; autoW=false;
      for(let i=0;i<s.length;++i){ c=s[i]; dx=0,dy=0,m=0; switch(c){
          case'T':case'B':case'F':case'G':gap=+s[++i];makeWalls(c,gap);break;
          case'1':x=y=0;break; case'2':x=mid,y=0;break; case'3':x=end,y=0;break;
          case'4':x=0,y=mid;break; case'5':x=y=mid;break; case'6':x=end,y=mid;break;
          case'7':x=0,y=end;break; case'8':x=mid,y=end;break; case'9':x=y=end;break;
          case'u':dy=-1;break; case'd':dy=1;break; case'l':dx=-1;break; case'r':dx=1;break;
          case'U':dy=-1,m=1;break; case'D':dy=1,m=1;break; case'L':dx=-1,m=1;break; case'R':dx=1,m=1;break;
          case'W':autoW=!autoW;if(!autoW)break; case'w':makeBasic('w','tile wall',x,y);break;
          case'c':case'g':st=+s[++i];if(isGot())break;makeFlavor(c,c=='c'?'coin':'gate',x,y,st);break;
          case'p':st=+s[++i];n=makeFlavor(c,'plate',x,y,st);n.got=isGot();n.el.classList.toggle('full',n.got);break;
          case'o':gotIdx=got.findIndex(g=>g.r==room&&g.x==x&&g.y==y); if(gotIdx==-1)makeBasic(c,'plate omni',x,y);
            else makeFlavor(c,'plate omni full',x,y,got[gotIdx].st).got=true; break;
          case'j':st1=+s[++i],st2=+s[++i];makeJoiner(x,y);break;
          case's':st1=+s[++i],st2=+s[++i];makeSplitter(x,y);break;
          case'Z':makeBasic('Z','end',x,y).el.textContent=endMsg;break; }
        if(dx||dy){ rpt=1; if(m){rpt=+s[++i]; if(rpt==1)rpt=10+ +s[++i];}
          for(j=0;j<rpt;++j){x+=dx,y+=dy;if(autoW)makeBasic('w','tile wall',x,y);} }}
      makeGuy(); }

    document.body.addEventListener('pointerdown',(e)=>{ if(e.button>0)return; e.preventDefault(); stopInput();
      x=e.clientX;y=e.clientY; document.body.setPointerCapture(e.pointerId);
      view=land.getBoundingClientRect(); if(x<view.left||x>view.right||y<view.top||y>view.bottom)return;
      box=guy.getBoundingClientRect(); clickGuy= x>=box.left&&x<=box.right&&y>=box.top&&y<=box.bottom;
      if(clickGuy&&!outgrowHelp){help=true,dHelp();}
      input.pointerId=e.pointerId; input.type='p'; input.targX=e.clientX;input.targY=e.clientY;
      beginInput(pStep,360,130); });
    document.body.addEventListener('pointermove',(e)=>{ if(e.pointerType=='mouse'&&e.buttons==0)return;
      if(e.pointerId==input.pointerId){input.targX=e.clientX;input.targY=e.clientY;} });
    document.body.addEventListener('pointerup',(e)=>{if(input.type=='p'&&e.pointerId==input.pointerId)stopInput();});
    document.body.addEventListener('pointercancel',(e)=>{
      if(input.type=='p'&&e.pointerId==input.pointerId)stopInput(); });
    document.body.addEventListener('touchstart',(e)=>{e.preventDefault();},{passive:false});
    window.addEventListener('keydown',(e)=>{ if(e.repeat)return; dx=0;dy=0;
      if(e.key=='ArrowRight'||e.key=='d'||e.key=='D')dx=1; if(e.key=='ArrowLeft'||e.key=='a'||e.key=='A')dx=-1;
      if(e.key=='ArrowUp'||e.key=='w'||e.key=='W')dy=-1; if(e.key=='ArrowDown'||e.key=='s'||e.key=='S')dy=1;
      if(dx||dy){ stopInput(); input.type='k'; input.key=e.key; input.dirX=dx;input.dirY=dy;
        beginInput(kbStep,240,120); }
      if(dev){ if(e.key=='c')slotsUsed=4,slots=[0,0,0,0],dHands();
        if(e.key=='b')slotsUsed=4,slots=[1,1,1,1],dHands();
        if(e.key=='x')slotsUsed=0,slots=[-1,-1,-1,-1],dHands();
        if(e.key==' ')noclip=!noclip;
      } else{if(e.key=='0')++unlockDev;else unlockDev=0; if(unlockDev==5)dev=true;} });
    window.addEventListener('keyup',(e)=>{if(input.type=='k'&&input.key==e.key)stopInput();});
    function resize(){ window.scrollTo(0,0); vv=window.visualViewport;
      width=vv?vv.width:document.documentElement.clientWidth;
      height=vv?vv.height:document.documentElement.clientHeight;
      document.body.style.width=`${width}px`; document.body.style.height=`${height}px`;
      bounds=min(width,height); document.documentElement.style.setProperty('--bounds', `${bounds}px`); }
    window.addEventListener('blur',()=>{stopInput();})
    window.addEventListener('resize',resize); if(window.visualViewport){
      window.visualViewport.addEventListener('resize',resize);
      window.visualViewport.addEventListener('scroll',resize); }
